services:
  ui:
    build:
      context: ./uis
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/uis
      - /uis/website/node_modules
      - /uis/backoffice/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - company_network

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - company_network

  backend:
    image: project-3-backend
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command:
      - uv
      - run
      - uvicorn
      - services.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - task_data:/app/task_data
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TASK_DATA_DIR: /app/task_data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - company_network

  worker:
    image: project-3-backend
    command:
      - uv
      - run
      - celery
      - -A
      - services.celery_app
      - worker
      - --loglevel=info
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - task_data:/app/task_data
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TASK_DATA_DIR: /app/task_data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - company_network

  flower:
    image: project-3-backend
    command:
      - uv
      - run
      - celery
      - -A
      - services.celery_app
      - flower
      - --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - company_network

volumes:
  task_data:

networks:
  company_network:
    name: company_network
    driver: bridge
